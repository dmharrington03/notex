# Copy this file to config.yaml and fill in real paths for your machine.
# config.yaml is gitignored since these paths are machine-specific.
#
# Additional sections (naming:) are added in later phases as the code that
# consumes them is implemented — see AGENTS.md for current phase status.

paths:
  input_root: "/path/to/notes_raw"
  vault_root: "/path/to/vault"

mathpix:
  poll_interval_seconds: 5
  max_poll_attempts: 60

llm:
  model: "claude-haiku-4-5-20251001"
  prompt_version: "cleanup_v1"
  validation:
    min_length_ratio: 0.70
    max_length_ratio: 1.30

output:
  date_format: "%Y-%m-%d"
  # Per-course tags, keyed by the raw course folder name (underscores, not
  # spaces). There is no global/default tag list — a course with no entry
  # here gets no tags at all.
  course_tags:
    18.06_Linear_Algebra:
      - "lecture-notes"
      - "linear-algebra"
      - "math"
  figures_dark_mode_flag: false

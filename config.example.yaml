# Copy this file to config.yaml and fill in real paths for your machine.
# config.yaml is gitignored since these paths are machine-specific.

paths:
  input_root: "/path/to/notes_raw"
  vault_root: "/path/to/vault"

mathpix:
  poll_interval_seconds: 5
  max_poll_attempts: 60

llm:
  model: "claude-haiku-4-5-20251001"
  prompt_version: "cleanup_v1"
  validation:
    min_length_ratio: 0.70
    max_length_ratio: 1.30

output:
  date_format: "%Y-%m-%d"
  # Per-course tags, keyed by the raw course folder name (underscores, not
  # spaces). There is no global/default tag list — a course with no entry
  # here gets no tags at all.
  course_tags:
    18.06_Linear_Algebra:
      - "lecture-notes"
      - "linear-algebra"
      - "math"
  figures_dark_mode_flag: false
  # "markdown" (default) keeps standard ![alt](path) image syntax;
  # "obsidian" rewrites figure embeds to ![[path]] wikilink form, which
  # (unlike standard Markdown) tolerates whitespace in the path.
  image_link_syntax: markdown

naming:
  # Global prefix used for both the vault filename ("Lecture 01.md") and the
  # frontmatter title. No per-course override.
  lecture_prefix: "Lecture"

cli:
  # Whether main() prints the full processed/skipped/errors/tokens/cost
  # breakdown at the end of a run. Off by default -- the live reporter
  # (plus its "Finished in X.XX s"/"Done in X.X s" completion message)
  # already covers most runs' needs.
  print_summary: false

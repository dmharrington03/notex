# Reproduce with: conda env create -f environment.yml
# Update after changes with: conda env export --from-history > environment.yml
#
# Phase 1/2/3 dependencies. Additional packages (click, etc.) get added in
# later phases as their stages are implemented.
#
# requests is included for manual Mathpix API key verification; the pipeline
# itself is built on httpx (see src/mathpix.py). pyyaml parses config.yaml
# (see src/config.py). litellm is the LLM API abstraction used by the Phase 3
# cleanup stage (see src/llm.py, ANTHROPIC_API_KEY in .env). rich is used by
# src/reporting.py's RichReporter (issue #49) for the interactive-TTY Live
# progress table; PlainReporter has no dependency on it.

name: notex
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - httpx
  - python-dotenv
  - pytest
  - requests
  - pyyaml
  - conda-forge::respx
  - conda-forge::litellm
  - conda-forge::rich
